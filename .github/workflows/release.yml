name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: torrentty
            asset_name: torrentty-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: torrentty
            asset_name: torrentty-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: torrentty.exe
            asset_name: torrentty-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.binary_name }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }} ${{ matrix.binary_name }}

      - name: Publish asset to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ -z "$TAG" || "$TAG" == "main" ]]; then
            TAG="v1.0.0"
          fi

          # Create the release if it doesn't exist yet
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Torrentty $TAG" --generate-notes
          
          # Upload or overwrite the asset
          gh release upload "$TAG" "${{ matrix.asset_name }}" --clobber
