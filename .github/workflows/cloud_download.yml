name: Cloud Torrent Download

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: 'Magnet URI or InfoHash'
        required: true
      name:
        description: 'Torrent file or item name'
        required: true
      tag:
        description: 'Release tag to upload to'
        default: 'proof'
      torrent_url:
        description: 'Direct .torrent URL if available'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  download:
    name: Fast Cloud Download
    runs-on: ubuntu-latest
    steps:
      - name: Restore Accelerator Tools & DHT Cache
        uses: actions/cache/restore@v4
        id: cache-tools
        with:
          path: |
            /usr/local/bin/aria2c
            /usr/local/bin/cloudflared
            /home/runner/.cache/aria2
          key: cloud-tools-dht-v1
          restore-keys: |
            cloud-tools-dht-

      - name: Fast Zero-Install Tooling
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          echo "Installing cloud accelerator tools in parallel..."
          sudo curl -sLo /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && sudo chmod +x /usr/local/bin/cloudflared &
          (curl -sLo /tmp/aria2.tar.gz https://github.com/P3TERX/Aria2-Pro-Core/releases/latest/download/aria2-1.37.0-static-linux-amd64.tar.gz && tar -xzf /tmp/aria2.tar.gz -C /tmp && sudo mv /tmp/aria2c /usr/local/bin/ && sudo chmod +x /usr/local/bin/aria2c) || sudo apt-get install -y --no-install-recommends aria2 &
          wait
          echo "Tooling ready: aria2, cloudflared"

      - name: Save Accelerator Tools & DHT Cache
        if: steps.cache-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/bin/aria2c
            /usr/local/bin/cloudflared
            /home/runner/.cache/aria2
          key: cloud-tools-dht-v1

      - name: Extreme Accelerated Torrent Download & Stream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Initialize DHT directory and memory workspace
          mkdir -p /home/runner/.cache/aria2
          mkdir -p /dev/shm/dl
          cd /dev/shm/dl
          echo "Starting extreme accelerated download for ${{ inputs.name }}..."

          # Launch Python Multi-Threaded Range Server (RFC-7233) for 12x parallel client streaming
          python3 -c "
          import os, functools
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler

          class RangeRequestHandler(SimpleHTTPRequestHandler):
              def send_head(self):
                  path = self.translate_path(self.path)
                  if not os.path.isfile(path):
                      return super().send_head()
                  f = open(path, 'rb')
                  size = os.fstat(f.fileno()).st_size
                  range_header = self.headers.get('Range')
                  if not range_header:
                      return super().send_head()
                  try:
                      val = range_header.strip().lower()
                      if val.startswith('bytes='):
                          val = val[6:].split(',')[0].strip()
                          start_str, end_str = val.split('-')
                          start = int(start_str) if start_str else 0
                          end = int(end_str) if end_str else size - 1
                          if start >= size or start > end:
                              self.send_error(416, 'Range Not Satisfiable')
                              f.close()
                              return None
                          self.send_response(206)
                          self.send_header('Content-Type', self.guess_type(path))
                          self.send_header('Content-Range', f'bytes {start}-{end}/{size}')
                          self.send_header('Content-Length', str(end - start + 1))
                          self.send_header('Accept-Ranges', 'bytes')
                          self.send_header('Connection', 'keep-alive')
                          self.end_headers()
                          f.seek(start)
                          self.wfile.write(f.read(end - start + 1))
                          f.close()
                          return None
                  except Exception:
                      f.close()
                  return super().send_head()

          server = ThreadingHTTPServer(('0.0.0.0', 8080), functools.partial(RangeRequestHandler, directory='/dev/shm/dl'))
          server.serve_forever()
          " > /dev/shm/server.log 2>&1 &

          cloudflared tunnel --url http://127.0.0.1:8080 > /dev/shm/tunnel.log 2>&1 &

          ARIA2_OPTS=(
            --seed-time=0
            --file-allocation=falloc
            --bt-max-peers=500
            --bt-request-peer-speed-limit=200M
            --disk-cache=512M
            --max-overall-upload-limit=1K
            --bt-tracker-connect-timeout=5
            --bt-tracker-timeout=5
            --dht-entry-point=dht.transmissionbt.com:6881
            --summary-interval=1
            --enable-peer-exchange=true
          )

          TORRENT_URL="${{ inputs.torrent_url }}"
          if [ -n "$TORRENT_URL" ]; then
            echo "Direct .torrent download with tuned peer flags..."
            aria2c "${ARIA2_OPTS[@]}" "$TORRENT_URL" || true
          fi

          # If media file not yet obtained, fallback to magnet
          MEDIA_COUNT=$(find /dev/shm/dl -maxdepth 2 -type f ! -name "*.torrent" ! -name "*.dat" | wc -l)
          if [ "$MEDIA_COUNT" -eq 0 ]; then
            echo "Fallback to magnet URI with full tracker swarm..."
            aria2c "${ARIA2_OPTS[@]}" "${{ inputs.magnet }}"
          fi

          echo "Downloaded files in RAM disk:"
          ls -lh /dev/shm/dl

          # Clean up names
          rm -f *.torrent
          TARGET_FILE=""
          for f in *; do
            if [ -f "$f" ]; then
              clean_name="$(echo "$f" | sed 's/[][()]/_/g' | tr ' ' '_')"
              if [ "$clean_name" != "$f" ]; then
                mv "$f" "$clean_name"
              fi
              TARGET_FILE="$clean_name"
              break
            elif [ -d "$f" ]; then
              clean_name="$(echo "$f" | sed 's/[][()]/_/g' | tr ' ' '_').tar"
              tar -cf "$clean_name" "$f"
              TARGET_FILE="$clean_name"
              break
            fi
          done

          TAG="${{ inputs.tag }}"
          REPO="Aditya-233/Torrenty"

          # Extract Cloudflare tunnel URL
          TUNNEL_URL=""
          for i in {1..15}; do
            TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /dev/shm/tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done
          echo "Discovered Tunnel URL: $TUNNEL_URL"
          if [ -z "$TUNNEL_URL" ]; then
            echo "Tunnel log output:"
            cat /dev/shm/tunnel.log || true
          fi

          if [ -n "$TUNNEL_URL" ] && [ -n "$TARGET_FILE" ]; then
            STREAM_NOTE="STREAM_URL: $TUNNEL_URL/$TARGET_FILE"
            echo "Instant Stream URL available: $STREAM_NOTE"
            gh release edit "$TAG" --repo "$REPO" --notes "$STREAM_NOTE" 2>/dev/null || gh release create "$TAG" --repo "$REPO" --title "Torrent Cloud Downloads" --notes "$STREAM_NOTE" || true
          else
            echo "Tunnel URL not found, falling back to release upload..."
            gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "Torrent Cloud Downloads" --notes "Release fallback" || true
          fi

          # Upload to GitHub Release as permanent backup while client streams via tunnel
          if [ -n "$TARGET_FILE" ]; then
            echo "Starting GitHub release backup upload in background..."
            gh release upload "$TAG" "$TARGET_FILE" --repo "$REPO" --clobber &
            UPLOAD_PID=$!
            echo "Holding stream tunnel alive during release upload..."
            wait $UPLOAD_PID 2>/dev/null || sleep 90
            echo "Upload and stream session complete."
          else
            sleep 60
          fi
