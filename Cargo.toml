[package]
name = "torrentty"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Ultra-fast terminal BitTorrent client with asymmetric cloud swarm acceleration"
repository = "https://github.com/Aditya-233/Torrenty"
homepage = "https://github.com/Aditya-233/Torrenty"
readme = "README.md"
authors = ["Aditya <https://github.com/Aditya-233>"]
keywords = ["torrent", "bittorrent", "tui", "ratatui", "accelerator"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time"] }
librqbit = { version = "8.1.1", default-features = false, features = ["default-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "default-tls", "socks"] }
url = "2.5"

[dev-dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
