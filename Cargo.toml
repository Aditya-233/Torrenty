[package]
name = "torrentty"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time"] }
librqbit = { version = "8.1.1", default-features = false, features = ["default-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "default-tls", "socks"] }
url = "2.5"

[dev-dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
